repos:
  # Pre-commit hooks for basic checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # `packages/schema-1/spec/` holds byte copies of the eBus specification,
      # verified by byte comparison in tests/test_schema_one_conformance.py. Any
      # hook that rewrites a file must skip it: a "fix" there would silently
      # invalidate the comparison that makes the copies trustworthy. Non-mutating
      # checks (check-json) deliberately still run, since a corrupt copy should fail.
      - id: trailing-whitespace
        exclude: '^src/span_panel_api/generated_client/.*|^packages/schema-1/spec/.*|\..*_cache/.*|dist/.*|venv/.*|\.venv/.*'
      - id: end-of-file-fixer
        exclude: '^src/span_panel_api/generated_client/.*|^packages/schema-1/spec/.*|\..*_cache/.*|dist/.*|venv/.*|\.venv/.*'
      - id: check-yaml
        exclude: '^src/span_panel_api/generated_client/.*|\..*_cache/.*|dist/.*|venv/.*|\.venv/.*'
      - id: check-toml
        exclude: '^src/span_panel_api/generated_client/.*|\..*_cache/.*|dist/.*|venv/.*|\.venv/.*'
      - id: check-json
        exclude: '^src/span_panel_api/generated_client/.*|\..*_cache/.*|dist/.*|venv/.*|\.venv/.*'
      - id: check-added-large-files
      - id: check-merge-conflict
        exclude: '^src/span_panel_api/generated_client/.*|\..*_cache/.*|dist/.*|venv/.*|\.venv/.*'
      - id: debug-statements
        exclude: '^src/span_panel_api/generated_client/.*|generate_client\.py|scripts/.*|tests/.*|\..*_cache/.*|dist/.*|venv/.*|\.venv/.*|^examples/.*'
      - id: mixed-line-ending
        args: ['--fix=lf']
        exclude: '^src/span_panel_api/generated_client/.*|^packages/schema-1/spec/.*|\..*_cache/.*|dist/.*|venv/.*|\.venv/.*'

  # Ruff for formatting and linting
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.13
    hooks:
      # Run formatter first - exclude tests to avoid conflicts with black
      #
      # `scripts/` is excluded except for `peer_drift.py` and `_lock.py`, which run
      # on every commit and in CI and are held to the library's standard; the
      # hand-run tools beside them are not. `pyproject.toml` names the same two
      # exclusions for a bare `ruff check .`.
      - id: ruff-format
        exclude: '^src/span_panel_api/generated_client/.*|generate_client\.py|scripts/(?!peer_drift\.py$|_lock\.py$).*|tests/.*|\..*_cache/.*|dist/.*|venv/.*|\.venv/.*|^examples/.*'
      # Then linter - exclude tests and the hand-run scripts from strict linting
      - id: ruff-check
        args: ['--fix']
        exclude: '^src/span_panel_api/generated_client/.*|generate_client\.py|scripts/(?!peer_drift\.py$|_lock\.py$).*|tests/.*|\..*_cache/.*|dist/.*|venv/.*|\.venv/.*|^examples/.*'

  # Black for line length handling and test file formatting
  - repo: https://github.com/psf/black
    rev: 25.1.0
    hooks:
      - id: black
        language_version: python3
        args: [
          '--line-length=125',
          '--skip-string-normalization',
          '--target-version=py312',
          '--extend-exclude=src/span_panel_api/generated_client|generate_client\.py|scripts|\.venv|venv'
        ]
        exclude: '^src/span_panel_api/generated_client/.*|generate_client\.py|scripts/.*|\..*_cache/.*|dist/.*|venv/.*|\.venv/.*|^examples/.*'

  # Prettier for markdown formatting
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        types: [markdown]
        args: ['--config', '.prettierrc.json']
        exclude: '^src/span_panel_api/generated_client/.*|^packages/schema-1/spec/.*|\..*_cache/.*|dist/.*|venv/.*|\.venv/.*|node_modules/.*|htmlcov/.*'

  # Markdownlint for markdown files (after Prettier formatting)
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.15.0
    hooks:
      - id: markdownlint-cli2
        args: ['--config', '.markdownlint-cli2.jsonc']
        exclude: '^src/span_panel_api/generated_client/.*|^packages/schema-1/spec/.*|\..*_cache/.*|dist/.*|venv/.*|\.venv/.*|node_modules/.*|htmlcov/.*'

  # MyPy for type checking
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.16.0
    hooks:
      - id: mypy
        additional_dependencies:
          - httpx
          - click
          - typing-extensions
          - pytest
          - types-PyYAML
          - paho-mqtt
          # schema-1 parses the parent/child tree with the eBus SDK, which
          # ships py.typed — so the hook needs it installed to resolve those
          # types rather than silently reporting import-not-found.
          - ebus-sdk>=0.19.0
        args: ['--config-file=pyproject.toml']
        # `tests/reference_payloads/` is the one thing under tests/ this hook does
        # check. Its five accessors were type-checked as package data until 3.1.0
        # and are read by twenty test modules; moving them out of `src/` should not
        # have quietly cost them `--strict`. `pyproject.toml`'s own `exclude` still
        # names tests/, which is fine — that flag governs directory discovery, and
        # a file passed by name is checked regardless.
        #
        # `scripts/peer_drift.py` and `scripts/_lock.py` are checked for the same
        # reason: they decide whether a commit goes through, which is not the place
        # for the one part of the tree nothing type-checks. The hand-run scripts
        # beside them stay out — see `pyproject.toml`, which names them one by one.
        exclude: '^src/span_panel_api/generated_client/.*|scripts/(?!peer_drift\.py$|_lock\.py$).*|tests/(?!reference_payloads/).*|docs/.*|examples/.*|\..*_cache/.*|dist/.*|venv/.*'

  # Pylint for code quality
  - repo: https://github.com/pycqa/pylint
    rev: v3.3.3
    hooks:
      - id: pylint
        additional_dependencies:
          - httpx
          - click
          - typing-extensions
          - pytest
          - pyyaml
          - paho-mqtt
          # schema-1 imports the eBus SDK; without it here the hook reports
          # import-error for a dependency that is correctly declared.
          - ebus-sdk>=0.19.0
        exclude: '^src/span_panel_api/generated_client/.*|tests/.*|generate_client\.py|scripts/.*|\..*_cache/.*|dist/.*|venv/.*|\.venv/.*|^examples/.*'

  # Check for common security issues
  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        args: ['-c', 'pyproject.toml']
        additional_dependencies: ['bandit[toml]']
        exclude: '^tests/.*|^scripts/.*|^src/span_panel_api/generated_client/.*|\..*_cache/.*|dist/.*|venv/.*|\.venv/.*|^examples/.*'

  # Vulture for dead code detection
  - repo: local
    hooks:
      - id: vulture
        name: vulture
        entry: bash -c 'uv run vulture src/span_panel_api/ packages/schema-0/src/span_panel_api_schema_0/ packages/schema-1/src/span_panel_api_schema_1/ --min-confidence 80'
        language: system
        types: [python]
        pass_filenames: false
        exclude: '^src/span_panel_api/generated_client/.*|\..*_cache/.*|dist/.*|venv/.*|\.venv/.*|^examples/.*'

  # uv lock check for lockfile validation
  - repo: local
    hooks:
      - id: uv-lock-check
        name: uv lock check
        entry: uv lock --check
        language: system
        pass_filenames: false
        files: ^pyproject\.toml$|^uv\.lock$

  # Have the producers moved past the pins in spec_lock.json?
  #
  # On a local commit, because CI finding this out is finding it out too late: the
  # drift this catches is a producer release nobody here noticed until a scheduled
  # job went red the next morning, by which time the commits that should have moved
  # the pin were already in.
  #
  # `stages: [pre-commit]` and `SKIP: peer-drift` in ci.yml keep it off pull
  # requests, and that is not an oversight to tidy up later: this question's answer
  # changes because somebody else pushed, so asking it of an author's unrelated
  # change would fail their build for a thing they did not do. peer-drift.yml asks
  # it daily, with --strict, where failing costs a notification and nothing else.
  #
  # It asks PyPI and GitHub, so it is the one hook that needs the network — and
  # deliberately non-strict, so it does not. A producer that cannot be reached
  # reports as unknown and the commit goes through; only a producer that has
  # actually moved past a pin stops one. Five calls at a ten-second timeout, so the
  # worst case is under a minute and only against a network that accepts
  # connections and then says nothing; a refused connection or a failed lookup
  # comes back at once.
  - repo: local
    hooks:
      - id: peer-drift
        name: peers still at their pins
        entry: uv run python scripts/peer_drift.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

  # Quick coverage check (total only, no details)
  - repo: local
    hooks:
      - id: pytest-cov-summary
        name: coverage summary
        entry: bash
        language: system
        args: ['-c', 'output=$(uv run pytest tests/ --cov=src/span_panel_api --cov=packages/schema-0/src/span_panel_api_schema_0 --cov=packages/schema-1/src/span_panel_api_schema_1 --cov-config=pyproject.toml --cov-fail-under=85 -q 2>&1); status=$?; echo "$output"; exit "$status"']
        pass_filenames: false
        verbose: true
