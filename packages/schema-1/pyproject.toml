[project]
name = "span-panel-api-schema-1"
version = "1.1.0"
description = "Parent/child schema (data-model-version 1.x) parser for span-panel-api"
authors = [
    {name = "SpanPanel"}
]
readme = "README.md"
license = "MIT"
requires-python = ">=3.14,<4.0"
dependencies = [
    # 3.0.0 is the first bootstrap that defines everything this parser imports --
    # `SpanMidSnapshot`, `ExtensionProperty`, `ExtensionSubject`, and a
    # `SpanPanelSnapshot` that accepts `extension_properties`. A lower floor lets
    # a resolver pair this wheel with a bootstrap that fails at import, the
    # precise hazard RELEASE.md warns about under "Releasing every distribution".
    # Stated as a stable version rather than as the prerelease the floor tracked
    # during development: naming a prerelease in a specifier is pip's own signal
    # that prereleases are acceptable for that requirement.
    # Raised to 3.1.0 for the same reason it was 3.0.0 before: that is the first
    # bootstrap defining everything this parser imports. 3.1.0 adds `ControlTarget`
    # and replaces the `set_*_topic` members with `set_*_target`, so this wheel is
    # rejected at discovery by any 3.0.x.
    "span-panel-api>=3.1.0,<4.0",
    # Only this distribution depends on the eBus SDK. The bootstrap and
    # schema-0 stay clean, so a flat-panel install never pulls it in — which is
    # what bounds the release coupling this dependency introduces to panels on
    # r202633+.
    # Ceiling set to the versions actually tested, and re-checked rather than
    # extrapolated each time it moves. 0.x carries no compatibility contract, and
    # this ships to hosts that are not quick to iterate on: widening later is a
    # patch release, while narrowing after a user's host has resolved a bad
    # pairing is not.
    #
    # Every bump so far has been publisher-side. Diffing the 0.22.0 and 0.23.1
    # wheels module by module, exactly two files change -- `__init__.py`, by the
    # version string alone, and `declaration.py`, the declarative builder. Our
    # whole surface is `Controller`, `homie.DiscoveredDevice` and structural
    # conformance to `MqttControllerTransport`; nothing here imports
    # `declaration`. The suite is green against 0.23.1 unchanged.
    #
    # The cost is a release here per SDK minor, which is real: 0.23.0 and 0.23.1
    # both shipped the same day the previous ceiling was set. Still the right
    # trade while the SDK is pre-1.0.
    "ebus-sdk>=0.19.0,<0.24",
]

[project.urls]
Homepage = "https://github.com/SpanPanel/span-panel-api"
Issues = "https://github.com/SpanPanel/span-panel-api/issues"

# The whole point of this distribution. Dispatch resolves `schema_1` for a 1.x
# panel by discovering this group, never by importing this package.
#
# Held back until the parser could answer for a panel end to end — mapper,
# field metadata, command topics, and recovery from a real broker outage.
# Installing this package remains the opt-in: a 1.x panel without it still gets
# the named SpanPanelAdapterMissingError rather than a silent misparse.
[project.entry-points."span_panel_api.schema_adapters"]
schema_1 = "span_panel_api_schema_1:SchemaOneAdapter"

[tool.uv.sources]
span-panel-api = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/span_panel_api_schema_1"]
