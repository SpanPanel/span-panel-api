[project]
name = "span-panel-api-schema-1"
version = "0.1.0b1"
description = "Parent/child schema (data-model-version 1.x) parser for span-panel-api"
authors = [
    {name = "SpanPanel"}
]
readme = "README.md"
license = "MIT"
requires-python = ">=3.10,<4.0"
dependencies = [
    "span-panel-api>=3.0.0b1,<4.0",
    # Only this distribution depends on the eBus SDK. The bootstrap and
    # schema-0 stay clean, so a flat-panel install never pulls it in — which is
    # what bounds the release coupling this dependency introduces to panels on
    # r202633+.
    "ebus-sdk>=0.17.0,<1.0",
]

[project.urls]
Homepage = "https://github.com/SpanPanel/span-panel-api"
Issues = "https://github.com/SpanPanel/span-panel-api/issues"

# NO [project.entry-points."span_panel_api.schema_adapters"] BLOCK YET.
#
# Deliberate, and the reason is the failure mode. Registering `schema_1` makes
# dispatch resolve it for a 1.x panel, which would then fail somewhere inside
# snapshot building — an opaque error, late, on a path the user cannot act on.
# Unregistered, the same panel gets the clean SpanPanelAdapterMissingError that
# Phase 2 Part A built, naming exactly what is missing.
#
# The entry point lands with the snapshot mapper (Phase 2 task 4), when this
# package can answer for a panel end to end.

[tool.uv.sources]
span-panel-api = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/span_panel_api_schema_1"]
