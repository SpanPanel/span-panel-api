version: 2
updates:
  # Enable version updates for Python dependencies
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    # Raised from 1 for `ebus-panel-sim`. It is the producer of the schema_1
    # reference capture, so its bump is a wire question and not a tooling one: the
    # PR has to re-run scripts/capture_parent_child_reference.py, and the suite is
    # what answers whether the wire moved. A limit of 1 let a pytest bump take the
    # only slot and hold that question back for a week.
    open-pull-requests-limit: 5
    allow:
      - dependency-type: "all"
    # `ebus-panel-sim` is deliberately in none of these groups, and must stay that
    # way. A grouped bump arrives as one commit with one review, and a wire change
    # buried in a pytest bump is a wire change nobody read.
    groups:
      # Group development dependencies together
      dev-dependencies:
        patterns:
          - "pytest*"
          - "mypy"
          - "ruff"
          - "bandit"
          - "pre-commit"
          - "twine"
          - "*-cov"
          - "types-*"
      # Group documentation dependencies
      docs-dependencies:
        patterns:
          - "mkdocs*"
          - "mkdocstrings"
      # Group core runtime dependencies for span-panel-api
      runtime-dependencies:
        patterns:
          - "httpx"
          - "attrs"
          - "python-dateutil"
          - "click"
    reviewers:
      - "cayossarian"
    assignees:
      - "cayossarian"

  # Enable version updates for Python dependencies (generated client)
  - package-ecosystem: "pip"
    directory: "/generated_client"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    allow:
      - dependency-type: "all"
    reviewers:
      - "cayossarian"
    assignees:
      - "cayossarian"

  # Enable version updates for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    reviewers:
      - "cayossarian"
    assignees:
      - "cayossarian"
