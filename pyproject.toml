[project]
name = "span-panel-api"
version = "3.1.1"
description = "A client library for SPAN Panel API"
authors = [
    {name = "SpanPanel"}
]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14,<4.0"
# Declared so the published metadata states the supported version rather than
# leaving a reader to infer it, and so the README's Python badge can be derived
# from PyPI instead of hardcoded. The hardcoded one said "3.10+" for the whole
# of 3.0.0, five minor versions below the real floor -- a number nothing checked
# because nothing could.
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Home Automation",
    "Typing :: Typed",
]
dependencies = [
    # Bounded, and the bound is load-bearing. httpx 1.0 is an API rewrite that
    # removes `AsyncClient`, and 1.0.dev1..dev4 are on PyPI now. The bound was
    # first set when every distribution here was a prerelease and `pip install
    # --pre` was the prescribed verb, which made those dev releases resolvable;
    # that particular exposure ended at 3.0.0, but the ceiling stays, because a
    # caller may still pass `--pre` for its own reasons and because a ceiling
    # cannot be added to a version already published. `paho-mqtt` has been
    # bounded from the start; this was the one unbounded runtime dependency.
    "httpx>=0.28.1,<1.0",
    "paho-mqtt>=2.0.0,<3.0.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
# Not runtime dependencies: this distribution still registers no adapter and
# imports none, and `scripts/verify_adapterless_install.py` holds that line.
# These exist so `pip install -U "span-panel-api[schema-0,schema-1]"` has a
# correct upgrade path, because the dependency arrow runs the other way -- an
# adapter floors on the bootstrap, the bootstrap requires no adapter -- so
# upgrading the bootstrap alone leaves stale adapter wheels that
# `_derive_required_members` then rejects at discovery, with pip reporting
# success. An extra is the only thing pip can act on, and extras cannot be added
# to a version after it is published.
#
# Floors are stable versions deliberately. A specifier that names a prerelease
# is pip's own signal that prereleases are acceptable for that requirement, so a
# `>=1.0.0b5` floor here would leave a released install willing to resolve a
# future beta of the adapter without anyone asking for one.
# Raised to 1.1.0 for 3.1.0, and this floor is not cosmetic. The `SchemaAdapter`
# protocol replaced `set_*_topic` with `set_*_target`, and `_derive_required_members`
# makes every public protocol member mandatory of every adapter wheel — so a 1.0.0
# adapter installed against this bootstrap is rejected at discovery rather than
# working in a degraded way. The two must move together.
schema-0 = ["span-panel-api-schema-0>=1.1.0"]
schema-1 = ["span-panel-api-schema-1>=1.1.0"]

[project.urls]
Homepage = "https://github.com/SpanPanel/span-panel-api"
Issues = "https://github.com/SpanPanel/span-panel-api/issues"

# No [project.entry-points."span_panel_api.schema_adapters"] block here, and that
# absence is the point of Phase 1: this distribution registers no adapter and
# imports none. Adapters are separate distributions that register themselves —
# see packages/schema-0. Adding a block here would silently re-couple the
# bootstrap to a parser and undo the split.

[dependency-groups]
dev = [
    # The adapter is a dev dependency, never a runtime one: the bootstrap must
    # remain installable without it. It is here so the test suite exercises the
    # two distributions together, which is the configuration users will run.
    "span-panel-api-schema-0",
    "span-panel-api-schema-1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov",
    "bandit>=1.9.4",
    "pre-commit",
    "black",
    "ruff>=0.15.5",
    "mypy",
    "pylint",
    "radon",
    # 7.0 or newer: hatchling emits `Metadata-Version: 2.5` and twine 6.2 rejects
    # it as invalid. The build backend is resolved fresh at build time from an
    # unpinned `[build-system] requires`, so the metadata version moves without
    # anything in this repository changing -- which is how a green CI turned red
    # on a commit that touched two changelogs and a dependency floor.
    "twine>=7.0",
    "vulture>=2.14",
    "types-pyyaml>=6.0.12.20250915",
    "coverage",
    # tests/test_ssl_context.py mints an AKI-less CA to prove the panel's
    # certificate still handshakes. It reached the environment only as a
    # transitive of `twine -> keyring -> secretstorage`, which is marked
    # `sys_platform == 'linux'` -- so the whole module ran in CI and silently
    # skipped on every macOS checkout, which reads in the summary line exactly
    # like passing. See DEVELOPMENT.md, "A skip here is not a pass".
    #
    # Floored at 50.0.0 rather than at whatever the lock happens to hold: four
    # advisories cover the range below it (the highest first patched in 50.0.0),
    # and a floor states that as a constraint the resolver enforces, whereas the
    # lock is not published and binds nobody who checks this repository out.
    "cryptography>=50.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# One repo, independent distributions. The adapter is a workspace member so the
# test suite runs against both halves together, while `uv build` in each
# directory still produces a distribution that can be installed on its own —
# which is what the adapter-less install test depends on.
[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
span-panel-api-schema-0 = { workspace = true }
span-panel-api-schema-1 = { workspace = true }

[tool.hatch.build.targets.wheel]
# `scripts/` is deliberately absent. Shipping it put `scripts/__init__.py` at the
# top level of every consumer's site-packages, so an unrelated `import scripts`
# in a Home Assistant venv resolved to this distribution, and it installed a
# markdown formatter as a console script for every user. It is a dev tool;
# `scripts/format.sh` runs it by path.
packages = ["src/span_panel_api"]

[tool.hatch.build.targets.sdist]
# Explicit, because the default swept the whole tree: the root sdist contained
# packages/schema-0 and packages/schema-1 in full, contradicting the one
# invariant this distribution is built around -- that it registers no adapter and
# imports none. Anyone auditing the bootstrap sdist found both parsers inside it.
# Anchored with a leading slash: an unanchored "README.md" is a glob that matches
# at any depth, which pulled each adapter's own README, CHANGELOG and pyproject
# back in and left the bootstrap sdist still naming both parsers.
include = [
    "/src/span_panel_api",
    "/tests",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
    "/pyproject.toml",
]

[tool.ruff]
line-length = 125
exclude = [
    "scripts/",
    ".*_cache/",
    "dist/",
    "venv/",
    ".venv/",
]

[tool.ruff.lint.per-file-ignores]
# Exclude tests from ALL linting checks (formatting still applies)
"tests/**/*.py" = ["ALL"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "T20",    # flake8-print
    "SIM",    # flake8-simplify
    "RUF",    # ruff-specific rules
]

ignore = [
    "E501",   # line too long - following Home Assistant's approach
    # May conflict with the formatter
    "W191",
    "E111",
    "E114",
    "E117",
]

[tool.ruff.lint.isort]
force-sort-within-sections = true
combine-as-imports = true
split-on-trailing-comma = false
# Every distribution in this workspace is first-party. Stated explicitly because
# the repo has more than one source root, and inference from a single `src/`
# would classify the adapter packages as third-party. Each new adapter package
# has to be added here -- schema_1 was missing for several releases, which is
# the failure this comment exists to prevent and did not.
known-first-party = ["span_panel_api", "span_panel_api_schema_0", "span_panel_api_schema_1"]

[tool.mypy]
# The declared floor. Type-checking as of the oldest supported interpreter is
# what catches a call into stdlib that only exists further up; checking as of a
# newer one would let it through. Floor and ceiling are the same version today,
# so this must move with `requires-python` rather than being left behind.
python_version = "3.14"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
explicit_package_bases = true
mypy_path = "src"
exclude = [
    "scripts/",
    "tests/",
    "docs/",
    ".*_cache/",
    "dist/",
    "venv/",
    ".venv/",
]

[[tool.mypy.overrides]]
module = [
    "httpx.*",
    "paho.*",
]
ignore_missing_imports = true


[tool.coverage.run]
data_file = ".local_coverage_data"
source = [
    "src/span_panel_api",
    "packages/schema-0/src/span_panel_api_schema_0",
    "packages/schema-1/src/span_panel_api_schema_1",
]
omit = [
    "tests/*",
    "*/tests/*",
    "*/.venv/*",
    "*/venv/*",
]

[tool.coverage.report]
fail_under = 85.0
exclude_lines = [
    # Standard exclusions
    "pragma: no cover",
    "# pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
    # Import error handling - defensive code
    "except ImportError as e:",
    "raise ImportError\\(",
    # Defensive exception handling for edge cases
    "except Exception:",
    "except Exception as e:",
    "# Ignore errors during cleanup",
    "pass",
]

[tool.bandit]
exclude_dirs = ["tests", "scripts"]

[tool.pylint.main]
load-plugins = ["pylint.extensions.no_self_use"]
extension-pkg-allow-list = []
# Every source root in the workspace, so cross-package imports resolve no matter
# which files a run happens to cover. Without this, pylint only finds
# `span_panel_api` when a run also includes a file under `src/` — so committing
# an adapter package on its own reports import-error for imports that are fine.
init-hook = "import sys; sys.path[:0] = ['src', 'packages/schema-0/src', 'packages/schema-1/src']"
ignore-paths = [
    "^tests/.*",
    "^scripts/.*",
]

[tool.pylint.messages_control]
disable = [
    # Import order is enforced by ruff's isort rules (lint select "I"), which
    # knows both workspace source roots via known-first-party. pylint has no
    # equivalent setting — only known-standard-library and known-third-party —
    # so it classifies span_panel_api_schema_0 as third-party and disagrees with
    # ruff on every adapter module. One authority for import order; ruff is the
    # one that can be told the truth about this layout.
    "wrong-import-order",
    "missing-module-docstring",
    "missing-class-docstring",
    "missing-function-docstring",
    "too-few-public-methods",
    # The transport implements four protocols, so its public surface is set by
    # how many the composition asks for rather than by anything a split would
    # improve. Every sibling in this family is already off for the same reason.
    "too-many-public-methods",
    "too-many-arguments",
    "too-many-instance-attributes",
    "too-many-locals",
    "too-many-branches",
    "too-many-statements",
    "too-many-lines",
    "too-many-positional-arguments",
    "no-self-use",
    "duplicate-code",
]

[tool.pylint.format]
max-line-length = 125

[tool.black]
line-length = 125
target-version = ["py312"]
skip-string-normalization = true
skip-magic-trailing-comma = false
exclude = '''
/(
    \.venv
    |venv
    |\.git
    |\.hg
    |\.mypy_cache
    |\.tox
    |\.nox
    |_build
    |buck-out
    |build
    |dist
    |scripts/coverage\.py
)/
'''

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
