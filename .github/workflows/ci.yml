name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # Push and pull_request both arrive by webhook, so a dropped delivery leaves a
  # commit with no run at all -- which reads the same as a commit that passed.
  # Dispatch re-runs this against any ref on demand -- a branch, or a tag when
  # checking what a release actually built.
  #
  #   gh workflow run ci.yml --ref main
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # One entry because `requires-python` is `>=3.14`: the declared floor and
        # the version tested are the same, which is the only arrangement where a
        # green run actually proves the range. Widen `requires-python` and this
        # list has to grow with it -- a floor no job runs is a claim, not a
        # guarantee.
        python-version: ["3.14"]

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true

    - name: Install dependencies
      run: uv sync --all-packages

    # The schema_1 provenance checks compare the vendored catalogs against
    # `ebus-panel-sim`'s own copies. `uv sync` above is all they need: the emitter is
    # a pinned dev dependency, so there is nothing to clone and nothing that can skip.
    - name: Run pre-commit hooks
      run: |
        uv run pre-commit run --all-files

    # -rs so a skip that does survive is named in the log rather than counted. The
    # only ones expected here are test_live_flat_differential.py, which needs a
    # capture from a real panel that is deliberately gitignored.
    - name: Run tests with pytest
      run: |
        uv run pytest tests/ -v -rs \
          --cov=src/span_panel_api \
          --cov=packages/schema-0/src/span_panel_api_schema_0 \
          --cov=packages/schema-1/src/span_panel_api_schema_1 \
          --cov-report=xml --cov-report=term-missing



  security-scan:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.14"

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true

    - name: Install dependencies
      run: uv sync --all-packages

    - name: Run Bandit security scan
      run: |
        uv run bandit -r src/ packages/ -f json -o bandit-report.json || true

    - name: Upload Bandit scan results
      uses: actions/upload-artifact@v7
      with:
        name: bandit-report
        path: bandit-report.json

  build-check:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.14"

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true

    - name: Install dependencies
      run: uv sync --all-packages

    - name: Build packages
      run: uv build --all-packages

    - name: Check packages
      run: uv run twine check dist/*

    # Every distribution here is fully annotated, so every distribution has to
    # carry the marker that lets a consumer's type checker see those annotations.
    # Without it the package resolves to Any downstream and the typing is inert.
    - name: Verify every wheel ships a py.typed marker
      run: |
        python -c "
        import glob, sys, zipfile
        wheels = glob.glob('dist/*.whl')
        if not wheels:
            sys.exit('::error::no wheels were built')
        for wheel in wheels:
            if not any(n.endswith('/py.typed') for n in zipfile.ZipFile(wheel).namelist()):
                sys.exit(f'::error::{wheel} ships no py.typed marker; downstream type checking would resolve it as Any')
            print(f'{wheel}: py.typed present')
        "

    # Each adapter ships the reference capture its consumers test against, so a
    # downstream suite reads the bytes its pinned version was built against rather
    # than vendoring a copy. Nothing in the manifests declares that -- hatchling
    # ships a directory inside a package directory either way -- so the built
    # artifact is where it has to be asserted.
    - name: Verify each adapter wheel ships its reference capture
      run: |
        python -c "
        import glob, sys, zipfile
        expected = {
            'span_panel_api_schema_0': 'span_panel_api_schema_0/reference/homie_schema.json',
            'span_panel_api_schema_1': 'span_panel_api_schema_1/reference/parent_child_tree.json',
        }
        wheels = glob.glob('dist/*.whl')
        if not wheels:
            sys.exit('::error::no wheels were built')
        seen = set()
        for wheel in wheels:
            names = zipfile.ZipFile(wheel).namelist()
            for package, path in expected.items():
                if any(n.startswith(package + '/') for n in names):
                    seen.add(package)
                    if path not in names:
                        sys.exit(f'::error::{wheel} ships {package} without {path}; downstream test suites read that file out of this wheel')
                    print(f'{wheel}: {path} present')
        missing = sorted(set(expected) - seen)
        if missing:
            sys.exit(f'::error::no wheel was built for {missing}')
        "

    # The configuration entry-point discovery exists to support, and the one
    # nothing else in CI exercises: the bootstrap wheel installed with no
    # adapter present. It must import, and it must fail by name rather than
    # with ModuleNotFoundError.
    - name: Verify the bootstrap installs without an adapter
      run: |
        uv venv /tmp/bootstrap-only
        VIRTUAL_ENV=/tmp/bootstrap-only uv pip install dist/span_panel_api-*.whl
        VIRTUAL_ENV=/tmp/bootstrap-only uv run --no-project python scripts/verify_adapterless_install.py

    - name: Upload build artifacts
      uses: actions/upload-artifact@v7
      with:
        name: dist
        path: dist/
