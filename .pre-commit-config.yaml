repos:
  # Pre-commit hooks for basic checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # `packages/schema-1/spec/` holds byte copies of the eBus specification,
      # verified by byte comparison in tests/test_schema_one_conformance.py. Any
      # hook that rewrites a file must skip it: a "fix" there would silently
      # invalidate the comparison that makes the copies trustworthy. Non-mutating
      # checks (check-json) deliberately still run, since a corrupt copy should fail.
      - id: trailing-whitespace
        exclude: '^src/span_panel_api/generated_client/.*|^packages/schema-1/spec/.*|\..*_cache/.*|dist/.*|venv/.*|\.venv/.*'
      - id: end-of-file-fixer
        exclude: '^src/span_panel_api/generated_client/.*|^packages/schema-1/spec/.*|\..*_cache/.*|dist/.*|venv/.*|\.venv/.*'
      - id: check-yaml
        exclude: '^src/span_panel_api/generated_client/.*|\..*_cache/.*|dist/.*|venv/.*|\.venv/.*'
      - id: check-toml
        exclude: '^src/span_panel_api/generated_client/.*|\..*_cache/.*|dist/.*|venv/.*|\.venv/.*'
      - id: check-json
        exclude: '^src/span_panel_api/generated_client/.*|\..*_cache/.*|dist/.*|venv/.*|\.venv/.*'
      - id: check-added-large-files
      - id: check-merge-conflict
        exclude: '^src/span_panel_api/generated_client/.*|\..*_cache/.*|dist/.*|venv/.*|\.venv/.*'
      - id: debug-statements
        exclude: '^src/span_panel_api/generated_client/.*|generate_client\.py|scripts/.*|tests/.*|\..*_cache/.*|dist/.*|venv/.*|\.venv/.*|^examples/.*'
      - id: mixed-line-ending
        args: ['--fix=lf']
        exclude: '^src/span_panel_api/generated_client/.*|^packages/schema-1/spec/.*|\..*_cache/.*|dist/.*|venv/.*|\.venv/.*'

  # Ruff for formatting and linting
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.13
    hooks:
      # Run formatter first - exclude tests to avoid conflicts with black
      #
      # `scripts/` is excluded except for `capture_parent_child_reference.py`, which
      # produces the fixture the schema_1 suite is written against and is held to the
      # library's standard; the hand-run tools beside it are not. `pyproject.toml`
      # names the same exclusions for a bare `ruff check .`.
      - id: ruff-format
        exclude: '^src/span_panel_api/generated_client/.*|generate_client\.py|scripts/(?!capture_parent_child_reference\.py$).*|tests/.*|\..*_cache/.*|dist/.*|venv/.*|\.venv/.*|^examples/.*'
      # Then linter - exclude tests and the hand-run scripts from strict linting
      - id: ruff-check
        args: ['--fix']
        exclude: '^src/span_panel_api/generated_client/.*|generate_client\.py|scripts/(?!capture_parent_child_reference\.py$).*|tests/.*|\..*_cache/.*|dist/.*|venv/.*|\.venv/.*|^examples/.*'

  # Black for line length handling and test file formatting
  - repo: https://github.com/psf/black
    rev: 25.1.0
    hooks:
      - id: black
        language_version: python3
        args: [
          '--line-length=125',
          '--skip-string-normalization',
          '--target-version=py312',
          '--extend-exclude=src/span_panel_api/generated_client|generate_client\.py|scripts|\.venv|venv'
        ]
        exclude: '^src/span_panel_api/generated_client/.*|generate_client\.py|scripts/.*|\..*_cache/.*|dist/.*|venv/.*|\.venv/.*|^examples/.*'

  # Prettier for markdown formatting
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        types: [markdown]
        args: ['--config', '.prettierrc.json']
        exclude: '^src/span_panel_api/generated_client/.*|^packages/schema-1/spec/.*|\..*_cache/.*|dist/.*|venv/.*|\.venv/.*|node_modules/.*|htmlcov/.*'

  # Markdownlint for markdown files (after Prettier formatting)
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.15.0
    hooks:
      - id: markdownlint-cli2
        args: ['--config', '.markdownlint-cli2.jsonc']
        exclude: '^src/span_panel_api/generated_client/.*|^packages/schema-1/spec/.*|\..*_cache/.*|dist/.*|venv/.*|\.venv/.*|node_modules/.*|htmlcov/.*'

  # MyPy for type checking, run out of the project environment rather than out of
  # one pre-commit builds.
  #
  # `mirrors-mypy` needs every typed import restated as `additional_dependencies`,
  # which is a second dependency declaration that drifts: it had already gone stale
  # once and needed `ebus-sdk` added by hand, and adding the emitter would have put
  # a hardcoded `ebus-panel-sim==<version>` here that a Dependabot bump of the real
  # pin would silently leave behind. `uv run` resolves from `pyproject.toml` and
  # `uv.lock`, so the checker sees exactly what the suite sees, and the pin has one
  # home. It also fixes a quieter divergence: the mirror was three minor versions
  # behind the mypy a developer gets from `uv run mypy`, so the hook and the
  # terminal could disagree about the same file.
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types_or: [python, pyi]
        require_serial: true
        args: ['--config-file=pyproject.toml']
        # `tests/reference_payloads/` is the one thing under tests/ this hook does
        # check. Its five accessors were type-checked as package data until 3.1.0
        # and are read by twenty test modules; moving them out of `src/` should not
        # have quietly cost them `--strict`. `pyproject.toml`'s own `exclude` still
        # names tests/, which is fine — that flag governs directory discovery, and
        # a file passed by name is checked regardless.
        #
        # `scripts/capture_parent_child_reference.py` is checked for the same reason:
        # every schema_1 test is written against what it writes, which is not the place
        # for the one part of the tree nothing type-checks. The hand-run scripts beside
        # it stay out — see `pyproject.toml`, which names them one by one.
        exclude: '^src/span_panel_api/generated_client/.*|scripts/(?!capture_parent_child_reference\.py$).*|tests/(?!reference_payloads/).*|docs/.*|examples/.*|\..*_cache/.*|dist/.*|venv/.*'

  # Pylint for code quality
  - repo: https://github.com/pycqa/pylint
    rev: v3.3.3
    hooks:
      - id: pylint
        additional_dependencies:
          - httpx
          - click
          - typing-extensions
          - pytest
          - pyyaml
          - paho-mqtt
          # schema-1 imports the eBus SDK; without it here the hook reports
          # import-error for a dependency that is correctly declared.
          - ebus-sdk>=0.19.0
        exclude: '^src/span_panel_api/generated_client/.*|tests/.*|generate_client\.py|scripts/.*|\..*_cache/.*|dist/.*|venv/.*|\.venv/.*|^examples/.*'

  # Check for common security issues
  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        args: ['-c', 'pyproject.toml']
        additional_dependencies: ['bandit[toml]']
        exclude: '^tests/.*|^scripts/.*|^src/span_panel_api/generated_client/.*|\..*_cache/.*|dist/.*|venv/.*|\.venv/.*|^examples/.*'

  # Vulture for dead code detection
  - repo: local
    hooks:
      - id: vulture
        name: vulture
        entry: bash -c 'uv run vulture src/span_panel_api/ packages/schema-0/src/span_panel_api_schema_0/ packages/schema-1/src/span_panel_api_schema_1/ --min-confidence 80'
        language: system
        types: [python]
        pass_filenames: false
        exclude: '^src/span_panel_api/generated_client/.*|\..*_cache/.*|dist/.*|venv/.*|\.venv/.*|^examples/.*'

  # uv lock check for lockfile validation
  - repo: local
    hooks:
      - id: uv-lock-check
        name: uv lock check
        entry: uv lock --check
        language: system
        pass_filenames: false
        files: ^pyproject\.toml$|^uv\.lock$

  # Quick coverage check (total only, no details)
  - repo: local
    hooks:
      - id: pytest-cov-summary
        name: coverage summary
        entry: bash
        language: system
        args: ['-c', 'output=$(uv run pytest tests/ --cov=src/span_panel_api --cov=packages/schema-0/src/span_panel_api_schema_0 --cov=packages/schema-1/src/span_panel_api_schema_1 --cov-config=pyproject.toml --cov-fail-under=85 -q 2>&1); status=$?; echo "$output"; exit "$status"']
        pass_filenames: false
        verbose: true
