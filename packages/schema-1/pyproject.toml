[project]
name = "span-panel-api-schema-1"
version = "0.1.0b6"
description = "Parent/child schema (data-model-version 1.x) parser for span-panel-api"
authors = [
    {name = "SpanPanel"}
]
readme = "README.md"
license = "MIT"
requires-python = ">=3.10,<4.0"
dependencies = [
    # b3, not b2: this parser imports `SpanMidSnapshot`, which 3.0.0b2 does not
    # define. A `>=3.0.0b2` floor lets a resolver pair this wheel with 3.0.0b2 and
    # fail on import -- the precise hazard RELEASE.md warns about under "Releasing
    # every distribution". schema-0 keeps its b2 floor; every name it imports is
    # present there, checked rather than assumed.
    "span-panel-api>=3.0.0b4,<4.0",
    # Only this distribution depends on the eBus SDK. The bootstrap and
    # schema-0 stay clean, so a flat-panel install never pulls it in — which is
    # what bounds the release coupling this dependency introduces to panels on
    # r202633+.
    # Ceiling tightened to the versions actually tested. 0.x carries no
    # compatibility contract, 0.21 and 0.22 shipped on the same day, and this
    # release reaches hosts that are not quick to iterate on. Widening a ceiling
    # later is a patch release; narrowing one after a user's host has resolved a
    # bad pairing is not. 0.22 was checked module by module and changes only
    # publisher-side code -- `adapter.py`, `topology.py`, `transport.py` and
    # `property.py` are byte-identical to 0.21 -- so this is a bound on exposure
    # rather than a report of breakage.
    "ebus-sdk>=0.19.0,<0.23",
]

[project.urls]
Homepage = "https://github.com/SpanPanel/span-panel-api"
Issues = "https://github.com/SpanPanel/span-panel-api/issues"

# The whole point of this distribution. Dispatch resolves `schema_1` for a 1.x
# panel by discovering this group, never by importing this package.
#
# Held back until the parser could answer for a panel end to end — mapper,
# field metadata, command topics, and recovery from a real broker outage.
# Installing this package remains the opt-in: a 1.x panel without it still gets
# the named SpanPanelAdapterMissingError rather than a silent misparse.
[project.entry-points."span_panel_api.schema_adapters"]
schema_1 = "span_panel_api_schema_1:SchemaOneAdapter"

[tool.uv.sources]
span-panel-api = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/span_panel_api_schema_1"]
