[project]
name = "span-panel-api"
version = "3.0.0b1"
description = "A client library for SPAN Panel API"
authors = [
    {name = "SpanPanel"}
]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10,<4.0"
dependencies = [
    "httpx>=0.28.1",
    "paho-mqtt>=2.0.0,<3.0.0",
    "pyyaml>=6.0.0",
]

[project.urls]
Homepage = "https://github.com/SpanPanel/span-panel-api"
Issues = "https://github.com/SpanPanel/span-panel-api/issues"

[project.scripts]
format-markdown = "scripts.format_markdown:main"

# No [project.entry-points."span_panel_api.schema_adapters"] block here, and that
# absence is the point of Phase 1: this distribution registers no adapter and
# imports none. Adapters are separate distributions that register themselves —
# see packages/schema-0. Adding a block here would silently re-couple the
# bootstrap to a parser and undo the split.

[dependency-groups]
dev = [
    # The adapter is a dev dependency, never a runtime one: the bootstrap must
    # remain installable without it. It is here so the test suite exercises the
    # two distributions together, which is the configuration users will run.
    "span-panel-api-schema-0",
    "span-panel-api-schema-1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov",
    "bandit>=1.9.4",
    "pre-commit",
    "black",
    "ruff>=0.15.5",
    "mypy",
    "pylint",
    "radon",
    "twine",
    "vulture>=2.14",
    "types-pyyaml>=6.0.12.20250915",
    "coverage",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# One repo, independent distributions. The adapter is a workspace member so the
# test suite runs against both halves together, while `uv build` in each
# directory still produces a distribution that can be installed on its own —
# which is what the adapter-less install test depends on.
[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
span-panel-api-schema-0 = { workspace = true }
span-panel-api-schema-1 = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/span_panel_api", "scripts"]

[tool.ruff]
line-length = 125
exclude = [
    "scripts/",
    ".*_cache/",
    "dist/",
    "venv/",
    ".venv/",
]

[tool.ruff.lint.per-file-ignores]
# Exclude tests from ALL linting checks (formatting still applies)
"tests/**/*.py" = ["ALL"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "T20",    # flake8-print
    "SIM",    # flake8-simplify
    "RUF",    # ruff-specific rules
]

ignore = [
    "E501",   # line too long - following Home Assistant's approach
    # May conflict with the formatter
    "W191",
    "E111",
    "E114",
    "E117",
]

[tool.ruff.lint.isort]
force-sort-within-sections = true
combine-as-imports = true
split-on-trailing-comma = false
# Both distributions in this workspace are first-party. Stated explicitly
# because the repo now has two source roots, and inference from a single `src/`
# would classify the adapter package as third-party.
known-first-party = ["span_panel_api", "span_panel_api_schema_0"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
explicit_package_bases = true
mypy_path = "src"
exclude = [
    "scripts/",
    "tests/",
    "docs/",
    ".*_cache/",
    "dist/",
    "venv/",
    ".venv/",
]

[[tool.mypy.overrides]]
module = [
    "httpx.*",
    "paho.*",
]
ignore_missing_imports = true


[tool.coverage.run]
data_file = ".local_coverage_data"
source = [
    "src/span_panel_api",
    "packages/schema-0/src/span_panel_api_schema_0",
    "packages/schema-1/src/span_panel_api_schema_1",
]
omit = [
    "tests/*",
    "*/tests/*",
    "*/.venv/*",
    "*/venv/*",
]

[tool.coverage.report]
fail_under = 85.0
exclude_lines = [
    # Standard exclusions
    "pragma: no cover",
    "# pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
    # Import error handling - defensive code
    "except ImportError as e:",
    "raise ImportError\\(",
    # Defensive exception handling for edge cases
    "except Exception:",
    "except Exception as e:",
    "# Ignore errors during cleanup",
    "pass",
]

[tool.bandit]
exclude_dirs = ["tests", "scripts"]

[tool.pylint.main]
load-plugins = ["pylint.extensions.no_self_use"]
extension-pkg-allow-list = []
# Every source root in the workspace, so cross-package imports resolve no matter
# which files a run happens to cover. Without this, pylint only finds
# `span_panel_api` when a run also includes a file under `src/` — so committing
# an adapter package on its own reports import-error for imports that are fine.
init-hook = "import sys; sys.path[:0] = ['src', 'packages/schema-0/src', 'packages/schema-1/src']"
ignore-paths = [
    "^tests/.*",
    "^scripts/.*",
]

[tool.pylint.messages_control]
disable = [
    # Import order is enforced by ruff's isort rules (lint select "I"), which
    # knows both workspace source roots via known-first-party. pylint has no
    # equivalent setting — only known-standard-library and known-third-party —
    # so it classifies span_panel_api_schema_0 as third-party and disagrees with
    # ruff on every adapter module. One authority for import order; ruff is the
    # one that can be told the truth about this layout.
    "wrong-import-order",
    "missing-module-docstring",
    "missing-class-docstring",
    "missing-function-docstring",
    "too-few-public-methods",
    "too-many-arguments",
    "too-many-instance-attributes",
    "too-many-locals",
    "too-many-branches",
    "too-many-statements",
    "too-many-lines",
    "too-many-positional-arguments",
    "no-self-use",
    "duplicate-code",
]

[tool.pylint.format]
max-line-length = 125

[tool.black]
line-length = 125
target-version = ["py312"]
skip-string-normalization = true
skip-magic-trailing-comma = false
exclude = '''
/(
    \.venv
    |venv
    |\.git
    |\.hg
    |\.mypy_cache
    |\.tox
    |\.nox
    |_build
    |buck-out
    |build
    |dist
    |scripts/coverage\.py
)/
'''

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
